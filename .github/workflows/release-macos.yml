name: Build macOS

# 触发：推到 main 自动跑；也可在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (aarch64 = Apple Silicon, GitHub macos-latest 本机架构)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: rhythm-desktop
        run: npm install

      # 未配置 Apple 开发者证书时，Tauri 会跳过签名，
      # 产出「未签名」的 .app / .dmg（可本地双击运行，便于自测）。
      # 若要对外分发并消除 Gatekeeper 拦截，需在此配置以下 secrets：
      #   APPLE_CERTIFICATE        (p12 证书 base64)
      #   APPLE_CERTIFICATE_PASSWORD
      #   APPLE_SIGNING_IDENTITY   (如 "Developer ID Application: xxx")
      #   APPLE_ID                 (Apple ID 邮箱)
      #   APPLE_PASSWORD           (app-specific password)
      #   APPLE_TEAM_ID
      # 说明：不直接打 universal-apple-darwin，因为 GitHub 的 macos-latest
      # 是 ARM 机器，交叉编译 x86_64 极易触发 ld 找不到系统框架而失败。
      # 改为打本机架构 aarch64（Apple Silicon，覆盖绝大多数现代 Mac），稳定可靠。
      # 如需 Intel 版，后续可新增一个 x86_64-apple-darwin 的 job。
      - name: Build Tauri app for macOS (unsigned, Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        with:
          projectPath: rhythm-desktop
          args: --target aarch64-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-macos-apple-silicon
          path: |
            rhythm-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            rhythm-desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
